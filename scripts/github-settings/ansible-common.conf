# Third-party actions allowed besides GitHub's own, space-separated.
allowed_actions="cdf-eagles/.github/.github/workflows/tool-drift.yaml@*"
# Required status checks on main, one per line.
required_checks="CI"
# true lets the repository's deploy keys bypass the main ruleset.
bypass_deploy_keys="false"
# true: release tags are created by administrators only and never moved or
# deleted.
release_tags="true"
# Every tag here is permanent: the releases are named as the version (1.0.0,
# no v prefix) and the legacy-roles tag keeps the removed roles' history.
release_tag_pattern="*"
