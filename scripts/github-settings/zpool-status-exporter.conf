# Third-party actions allowed besides GitHub's own, space-separated.
allowed_actions="golangci/golangci-lint-action@* ibiqlik/action-yamllint@* vmactions/freebsd-vm@*"
# Required status checks on main, one per line.
required_checks=""
# true lets the repository's deploy keys bypass the main ruleset.
bypass_deploy_keys="false"
# true: main takes fast-forward pushes from administrators only (no pull
# requests), develop takes squash-merged pull requests, and v* release tags are
# created by administrators only and never moved or deleted.
release_flow="true"
# Required status checks on develop (release flow only), one per line.
develop_required_checks="Lint
Test and build"
