# Third-party actions allowed besides GitHub's own, space-separated.
allowed_actions="golangci/golangci-lint-action@* vmactions/freebsd-vm@* cdf-eagles/.github/.github/workflows/tool-drift.yaml@*"
# Required status checks on main, one per line.
required_checks="Lint
Test and build
Secret scan"
# true lets the repository's deploy keys bypass the main ruleset.
bypass_deploy_keys="false"
# true: release tags (v*, the default release_tag_pattern) are created by
# administrators only and never moved or deleted.
release_tags="true"
