---
name: Validate

# Formatting, validation, and static checks only; needs no AWS credentials.
# No path filter: a required check that can be skipped blocks the merge.
on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  TERRAFORM_DOCS_VERSION: 0.24.0
  TERRAFORM_DOCS_SHA256: 9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3
  TOFU_VERSION: 1.13.9
  TFLINT_VERSION: v0.66.0
  SNYK_VERSION: 1.1308.4
  SNYK_SHA256: 979172ee128903f50e43fff221f22a0689579f22c086dabaa0d1a5416485b9ba

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 -- gitleaks scans the checked-out commit's full history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Install tools and assert preconditions
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet --require-virtualenv -r ci/requirements.txt
          echo "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"
          python3 -m venv "${RUNNER_TEMP}/checkov-venv"
          "${RUNNER_TEMP}/checkov-venv/bin/pip" install --quiet --require-virtualenv -r ci/checkov/requirements.txt
          echo "${RUNNER_TEMP}/checkov-venv/bin" >> "${GITHUB_PATH}"
          mkdir -p "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          fetch() {
            curl --proto "=https" --tlsv1.2 -sSfL -o "${RUNNER_TEMP}/${1}.tgz" "https://github.com/${2}"
            echo "${3}  ${RUNNER_TEMP}/${1}.tgz" | sha256sum -c -
            tar -xzf "${RUNNER_TEMP}/${1}.tgz" -C "${RUNNER_TEMP}/bin" "${1}"
          }
          fetch gitleaks "gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "${GITLEAKS_SHA256}"
          fetch terraform-docs "terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz" "${TERRAFORM_DOCS_SHA256}"
          "${RUNNER_TEMP}/bin/gitleaks" version
          "${RUNNER_TEMP}/bin/terraform-docs" --version
          "${RUNNER_TEMP}/checkov-venv/bin/checkov" --version
          "${RUNNER_TEMP}/venv/bin/pre-commit" --version
          shellcheck --version

      # No path filter: a secret can land in any file.
      - name: gitleaks (history of the checked-out commit)
        if: ${{ !cancelled() }}
        run: gitleaks git --no-banner --redact --verbose --log-opts="HEAD" .

      - name: Format
        if: ${{ !cancelled() }}
        run: tofu fmt -check -recursive -diff
      - name: Validate every stack
        if: ${{ !cancelled() }}
        run: |
          set -eu
          stacks=$(find stacks -name versions.tf -exec dirname {} \; | sort)
          test -n "$stacks"
          for d in $stacks; do
            echo "== $d"
            tofu -chdir="$d" init -backend=false -input=false >/dev/null
            tofu -chdir="$d" validate
          done
      # The token lifts GitHub's unauthenticated API rate limit for the ruleset
      # plugin download in tflint --init; it is the job's read-only token.
      - name: tflint
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl"
      - name: Checkov
        if: ${{ !cancelled() }}
        run: checkov --config-file .checkov.yml

      # The hooks of .pre-commit-config.yaml not run above; actionlint turns its
      # shellcheck checks off when shellcheck is not on PATH.
      - name: pre-commit
        if: ${{ !cancelled() }}
        env:
          SKIP: tofu_fmt,tofu_validate,tofu_tflint,tofu_checkov
        run: |
          set -euo pipefail
          command -v shellcheck
          pre-commit run --all-files --show-diff-on-failure

  snyk:
    name: Snyk
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Snyk CLI reads the dependency tree from the installed packages.
      # checkov needs an older packaging than virtualenv, so it has its own.
      - name: Install the Python tools
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet --require-virtualenv -r ci/requirements.txt
          python3 -m venv "${RUNNER_TEMP}/checkov-venv"
          "${RUNNER_TEMP}/checkov-venv/bin/pip" install --quiet --require-virtualenv -r ci/checkov/requirements.txt

      - name: Install the Snyk CLI
        run: |
          set -euo pipefail
          curl --proto "=https" --tlsv1.2 -sSfL -o "${RUNNER_TEMP}/snyk" \
            "https://github.com/snyk/cli/releases/download/v${SNYK_VERSION}/snyk-linux"
          echo "${SNYK_SHA256}  ${RUNNER_TEMP}/snyk" | sha256sum -c -
          chmod 755 "${RUNNER_TEMP}/snyk"
          "${RUNNER_TEMP}/snyk" --version

      # Fails on any high or critical issue in the CI tool pins, on a scan
      # error, and when a requirements file is missing, so the required check
      # fails closed. Dependabot pull requests read SNYK_TOKEN from the
      # Dependabot secrets.
      - name: Fail on high or critical dependency issues
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_DISABLE_ANALYTICS: 1
        run: |
          set -euo pipefail
          if [ -z "${SNYK_TOKEN}" ]; then
            echo "::error::SNYK_TOKEN is not set for this run"
            exit 1
          fi
          "${RUNNER_TEMP}/snyk" test --file=ci/requirements.txt --package-manager=pip \
            --command="${RUNNER_TEMP}/venv/bin/python" --severity-threshold=high \
            --policy-path=.snyk

      - name: Fail on high or critical dependency issues in checkov
        if: ${{ !cancelled() }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_DISABLE_ANALYTICS: 1
        run: |
          set -euo pipefail
          if [ -z "${SNYK_TOKEN}" ]; then
            echo "::error::SNYK_TOKEN is not set for this run"
            exit 1
          fi
          "${RUNNER_TEMP}/snyk" test --file=ci/checkov/requirements.txt --package-manager=pip \
            --command="${RUNNER_TEMP}/checkov-venv/bin/python" --severity-threshold=high \
            --policy-path=.snyk

  tool-drift:
    name: Tool drift
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    uses: cdf-eagles/.github/.github/workflows/tool-drift.yaml@a3ceea039aa09885488009ee39ac07d9e7cfdefe # v1.1.1
