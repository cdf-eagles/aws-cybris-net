---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: pip
    directory: /ci
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
  - package-ecosystem: terraform
    directories:
      - "/stacks/*"
      - "/stacks/30-hosts/*"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      providers:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
